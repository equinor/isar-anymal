name: Deploy to Development

concurrency:
  group: development-concurrency
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - "main"

jobs:
  get-short-sha:
    outputs:
      tag: ${{ steps.get-tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - id: get-tag
        run: |
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-8)
          echo "tag=$SHA_SHORT" >> "$GITHUB_OUTPUT"

  build-and-push-dev-image-to-robotics-dev-registry:
    name: Build and push dev image to robotics dev container registry
    needs: get-short-sha
    uses: Christdej/armada/.github/workflows/build_and_publish_docker_image_to_container_registry.yml@bisect/b-env-nonempty
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      registry: roboticsdevacr.azurecr.io
      image_name: robotics/isar-anymal
      tag: ${{ needs.get-short-sha.outputs.tag }}
      secondary_tag: dev
      push_to_ghcr: true
      path_to_dockerfile: Dockerfile.Isar
      path_to_context: .
    secrets:
      registry_password: ${{ secrets.ROBOTICS_ROBOTICSDEVACR_PASSWORD }}
      registry_username: ${{ secrets.ROBOTICS_ROBOTICSDEVACR_USERNAME }}

  build-and-push-ads-image-to-robotics-dev-registry:
    name: Build and push ads image to robotics dev container registry
    needs: get-short-sha
    uses: equinor/armada/.github/workflows/build_and_publish_docker_image_to_container_registry.yml@7aec39a7a9aae01089396d914edfaa4aa5fac800
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      registry: roboticsdevacr.azurecr.io
      image_name: robotics/ads-api
      tag: ${{ needs.get-short-sha.outputs.tag }}
      secondary_tag: dev
      # ads-api installs licensed ANYbotics packages; ACR only.
      path_to_dockerfile: ads_api/Dockerfile
      path_to_context: ads_api
    secrets:
      registry_password: ${{ secrets.ROBOTICS_ROBOTICSDEVACR_PASSWORD }}
      registry_username: ${{ secrets.ROBOTICS_ROBOTICSDEVACR_USERNAME }}
      anymal_download_password: ${{ secrets.ANYMAL_DOWNLOAD_PASSWORD }}
      anymal_download_username: ${{ secrets.ANYMAL_DOWNLOAD_USER_NAME }}

  deploy:
    name: Update deployment in Development
    needs: [get-short-sha, build-and-push-dev-image-to-robotics-dev-registry, build-and-push-ads-image-to-robotics-dev-registry]
    uses: equinor/armada/.github/workflows/update_kubernetes_deployment.yml@main
    with:
      environment: development
      registry: roboticsdevacr.azurecr.io
      image_name: robotics/isar-anymal
      tag: ${{ needs.get-short-sha.outputs.tag }}
      author_email: ${{ github.event.head_commit.author.email }}
      author_name: ${{ github.event.head_commit.author.name }}
      infrastructure_repository: equinor/robotics-infrastructure
      kustomization_base_path: k8s_kustomize/robotics/overlays
    secrets:
      deploy_key: ${{ secrets.ROBOTICS_INFRASTRUCTURE_DEPLOY_KEY }}
